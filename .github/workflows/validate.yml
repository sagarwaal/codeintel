name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills, plugin manifests, and schemas
        run: bash scripts/validate.sh
      - name: Run automated refresh test suite
        run: bash tests/test-refresh.sh
